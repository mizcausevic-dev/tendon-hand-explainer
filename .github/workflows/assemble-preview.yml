name: Assemble preview bundle
on:
  push:
    branches:
      - gh-pages
    paths:
      - parts/READY
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Concatenate the preview script
        run: |
          set -euo pipefail
          mkdir -p assets
          cat parts/js-* > assets/index-Ci79Z9Pa.js
          python3 - << 'PY'
          import hashlib, pathlib
          data = pathlib.Path("assets/index-Ci79Z9Pa.js").read_bytes()
          blob = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
          if len(data) != 559672 or blob != "4a266c6b3a7ad7a2b17cca8730f99f743288bd6d":
              raise SystemExit(f"mismatch size={len(data)} blob={blob}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-Ci79Z9Pa.js
          git rm -r parts
          git rm -f .github/workflows/assemble-preview.yml
          git commit -m "Publish the 34-second tendon-hand preview."
          git push origin HEAD:gh-pages
